name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --require-hashes -r requirements-app.lock && python -m pip install -e ".[dev]"
      - name: Product lint
        run: |
          ruff format --check unrender/product tests/test_product.py
          ruff check unrender/product unrender/schema/chart_schema.py tests/test_product.py
          ruff check --select S unrender/product
      - name: Product types
        run: mypy unrender/product
      - name: Frontend syntax
        run: node --check unrender/product/static/app.js
      - name: Runtime dependency audit
        run: pip-audit -r requirements-app.lock
      - name: Tests
        run: pytest -q
      - name: Build package
        run: python -m build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: unrender:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke production runtime dependencies
        run: docker run --rm unrender:ci python -c "import modal; from unrender.product.web import app; assert app.title == 'Unrender'"
