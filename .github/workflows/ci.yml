name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-build.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Product lint
        run: |
          ruff format --check unrender/product modal_train.py scripts tests/test_product.py tests/test_review_integrity.py tests/test_output_contract.py tests/test_extraction_provenance.py tests/test_inference_runtime.py tests/test_accounts.py tests/test_public_site.py tests/test_release_policy.py tests/test_train_config.py
          ruff check unrender/product unrender/schema/chart_schema.py modal_train.py scripts tests/test_product.py tests/test_review_integrity.py tests/test_output_contract.py tests/test_extraction_provenance.py tests/test_inference_runtime.py tests/test_accounts.py tests/test_public_site.py tests/test_release_policy.py tests/test_train_config.py
          ruff check --select S unrender/product
      - name: Evaluation contract lint
        run: |
          ruff check unrender/eval/metrics.py unrender/eval/score.py unrender/eval/paired_bootstrap.py unrender/eval/report.py unrender/eval/run_baselines.py unrender/eval/ledger.py tests/test_eval_ledger.py analysis/scoreboard.py analysis/parser_audit.py analysis/reproduce_common300.py analysis/error_audit.py tests/test_error_audit.py tests/test_common300_evidence.py unrender/eval/dataset.py unrender/eval/build_real_set.py unrender/eval/fetch_real_set.py tests/test_real_set.py tests/test_ground_truth_review.py unrender/schema/validate.py tests/test_repair.py tests/test_metric_contract.py
          ruff format --check unrender/eval/metrics.py unrender/eval/score.py unrender/eval/paired_bootstrap.py unrender/eval/report.py unrender/eval/run_baselines.py unrender/eval/ledger.py tests/test_eval_ledger.py analysis/scoreboard.py analysis/parser_audit.py analysis/reproduce_common300.py analysis/error_audit.py tests/test_error_audit.py tests/test_common300_evidence.py unrender/eval/dataset.py unrender/eval/build_real_set.py unrender/eval/fetch_real_set.py tests/test_real_set.py tests/test_ground_truth_review.py unrender/schema/validate.py tests/test_repair.py tests/test_metric_contract.py
      - name: Synthetic data provenance lint
        run: |
          ruff check unrender/data_gen/review.py tests/test_source_review.py
          ruff format --check unrender/data_gen/review.py tests/test_source_review.py
          ruff check unrender/data_gen/generate.py unrender/data_gen/provenance.py unrender/data_gen/split_dataset.py unrender/data_gen/layout.py analysis/audit_image_budget.py analysis/replay_augmentation.py tests/test_generation_contract.py tests/test_chart_layout.py tests/test_image_audit.py
          ruff format --check unrender/data_gen/generate.py unrender/data_gen/provenance.py unrender/data_gen/split_dataset.py unrender/data_gen/layout.py analysis/audit_image_budget.py analysis/replay_augmentation.py tests/test_generation_contract.py tests/test_chart_layout.py tests/test_image_audit.py
      - name: Training and serving contract lint
        run: |
          ruff check unrender/train/checkpoints.py unrender/train/collator.py unrender/train/loss.py unrender/train/recipe.py unrender/train/trainer.py unrender/train/sft_lora.py unrender/serving unrender/eval/comparison.py unrender/eval/providers.py tests/test_audit_comparison.py tests/test_checkpoint_receipts.py tests/test_cloud_evaluation.py tests/test_provider_attempts.py tests/test_worker_pool.py tests/test_training_recipe.py tests/test_training_loss.py tests/test_training_collator.py tests/test_training_adapter.py tests/test_serving.py analysis/audit_training_resume.py analysis/build_demo_fixture.py
          ruff format --check unrender/train/checkpoints.py unrender/train/collator.py unrender/train/loss.py unrender/train/recipe.py unrender/train/trainer.py unrender/train/sft_lora.py unrender/serving unrender/eval/comparison.py unrender/eval/providers.py tests/test_audit_comparison.py tests/test_checkpoint_receipts.py tests/test_cloud_evaluation.py tests/test_provider_attempts.py tests/test_worker_pool.py tests/test_training_recipe.py tests/test_training_loss.py tests/test_training_collator.py tests/test_training_adapter.py tests/test_serving.py analysis/audit_training_resume.py analysis/build_demo_fixture.py
      - name: Product types
        run: mypy unrender/product
      - name: Frontend syntax
        run: |
          node --check unrender/product/static/app.js
          node --check unrender/product/static/account.js
          node --check unrender/product/static/site.js
          node tests/browser_auth_epoch.mjs
          node tests/browser_two_tab.mjs
          node tests/browser_account.mjs
      - name: Runtime dependency audit
        run: |
          pip-audit -r requirements-app.lock
          pip-audit -r requirements-dev.lock
          pip-audit -r requirements-build.lock
          pip-audit --disable-pip --no-deps -r requirements-train.lock
      - name: Dependency inventory and license-policy structure
        run: |
          python scripts/generate_sbom.py
          git diff --exit-code -- release/sbom.cdx.json
          python scripts/check_release_licenses.py
      - name: Tests
        run: pytest -q
      - name: Build package
        run: python -m build --no-isolation

  training-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train-cpu.lock
      - name: Install exact CPU test runtime
        run: python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-train-cpu.lock
      - name: Download pinned processor without model weights
        run: |
          python - <<'PYCODE'
          import os
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              "unsloth/Qwen3-VL-4B-Instruct",
              revision="252d592b59b0233b226875a44ac135cfa1d3f755",
              allow_patterns=["*.json", "*.jinja", "*.txt"],
              ignore_patterns=["model.safetensors.index.json"],
          )
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"UNRENDER_TEST_PROCESSOR={path}\n")
          PYCODE
      - name: Actual Trainer gradients and Qwen processor contracts
        run: python -m pytest --noconftest tests/test_training_loss.py tests/test_training_collator.py tests/test_training_adapter.py -q
      - name: Kill and resume training processes
        run: python -m analysis.audit_training_resume --out "$RUNNER_TEMP/checkpoint-fault-evidence"

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: unrender:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke production runtime dependencies
        env:
          UNRENDER_MODAL_REVISION: 0123456789abcdef0123456789abcdef01234567
          UNRENDER_MODEL_DIGEST: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          UNRENDER_PROVIDER_RELEASE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          docker run --detach --name unrender-production-smoke \
            --env UNRENDER_ENV=production \
            --env UNRENDER_BASE_URL=https://unrender.example \
            --env UNRENDER_EXTRACTOR=modal \
            --env UNRENDER_ALLOW_REGISTRATION=false \
            --env UNRENDER_SEED_DEMO=false \
            --env UNRENDER_MODAL_MODEL=approved/unrender-model \
            --env UNRENDER_MODAL_REVISION="$UNRENDER_MODAL_REVISION" \
            --env UNRENDER_MODAL_MODEL_DIGEST="$UNRENDER_MODEL_DIGEST" \
            --env UNRENDER_MODAL_PROVIDER_RELEASE="$UNRENDER_PROVIDER_RELEASE" \
            unrender:ci
          trap 'docker rm --force unrender-production-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 25); do
            status=$(docker inspect --format '{{.State.Health.Status}}' unrender-production-smoke)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs unrender-production-smoke; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' unrender-production-smoke)" = healthy
          docker exec unrender-production-smoke python -c "import modal; from unrender.product.web import create_app; assert callable(create_app)"
          docker exec unrender-production-smoke sh -c 'command -v timeout && command -v unrender-operations-check'
          docker exec unrender-production-smoke python -c "import json, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/health/operations', headers={'Host': 'unrender.example'}); assert json.load(urllib.request.urlopen(req, timeout=3))['status'] == 'ok'"
          docker exec unrender-production-smoke sh -c 'test "$(id -u)" = 10001'
          docker exec --user root unrender-production-smoke sh -ec \
            'privileged=$(find /usr -xdev -type f -perm /6000 -print); test -z "$privileged"'
