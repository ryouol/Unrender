[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "unrender"
version = "0.2.0"
description = "Review-first chart digitization with auditable JSON, CSV, and XLSX exports."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ryouol" }]

# Core deps — everything needed to generate synthetic data, validate schemas,
# and run the eval scorer. All CPU-only, installs cleanly on Apple Silicon.
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "pypdfium2>=5.13,<6",
    "openpyxl>=3.1,<4",
    "stripe>=12,<14",
    "modal>=1.5,<2",
]

[project.urls]
Repository = "https://github.com/ryouol/Unrender"
Issues = "https://github.com/ryouol/Unrender/issues"

[project.optional-dependencies]
# Frontier-model benchmarking + fuzzy label matching for the scorer.
eval = [
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "anthropic>=0.34",
    "google-genai>=0.3",
]
# Phase 3 LoRA fine-tune (Qwen3-VL via Unsloth). CUDA-only — install on the
# rented GPU box, NOT Apple Silicon. torch is provided by the box's CUDA image.
train = [
    "unsloth",
    "trl>=0.9",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "transformers>=4.46",
    "accelerate>=0.34",
    "datasets>=2.20",
]
# Compatibility extra retained for existing `unrender[app]` install commands;
# product runtime dependencies are core because the wheel always ships its CLIs.
app = []
dev = [
    "beautifulsoup4>=4.13,<5",
    "pytest>=8.0,<10",
    "pytest-timeout>=2.4,<3",
    "httpx>=0.28,<1",
    "rapidfuzz>=3.6,<4",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "pip-audit==2.10.1",
]

[project.scripts]
unrender-serve = "unrender.product.cli:main"
unrender-admin = "unrender.product.admin:main"
unrender-healthcheck = "unrender.product.healthcheck:main"
unrender-operations-check = "unrender.product.operations_check:main"

[tool.setuptools.packages.find]
include = ["unrender*"]

# Ship the frozen eval subsets (common300.json, etc.) with the package — they are
# data, not code, so without this a `pip install` (and any in-container read) would
# miss them. The Modal score step now also writes resolved ids to a container-local
# file, but packaging keeps `python -m unrender.eval.score --subset <name>` working
# from an installed wheel too.
[tool.setuptools.package-data]
"unrender.eval" = ["subsets/*.json"]
"unrender.product" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.webmanifest",
    "static/icons/*",
    "static/demo/*",
    "static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so top-level modules (e.g. modal_train.py, which
# is a script, not part of the installed `unrender` package) import under a bare
# `pytest` invocation, not only `python -m pytest` (which adds CWD implicitly).
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "openpyxl"]
ignore_missing_imports = true
