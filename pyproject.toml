[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "unrender"
version = "0.2.0"
description = "Review-first chart digitization with auditable JSON, CSV, and XLSX exports."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ryouol" }]

# Core deps — everything needed to generate synthetic data, validate schemas,
# and run the eval scorer. All CPU-only, installs cleanly on Apple Silicon.
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "pypdfium2>=5.13,<6",
    "openpyxl>=3.1,<4",
    "stripe>=12,<14",
    "modal>=1.5,<2",
    "google-auth[requests]>=2.40,<3",
]

[project.urls]
Repository = "https://github.com/ryouol/Unrender"
Issues = "https://github.com/ryouol/Unrender/issues"

[project.optional-dependencies]
# Frontier-model benchmarking + fuzzy label matching for the scorer.
eval = [
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "openai>=3.16.2,<4",
    "anthropic>=0.34",
    "google-genai>=2.24.0,<3",
]
# CUDA training uses requirements-train.lock (exact Linux wheel hashes), then
# install the project with --no-deps. Do not resolve a separate mutable train extra.
# Compatibility extra retained for existing `unrender[app]` install commands;
# product runtime dependencies are core because the wheel always ships its CLIs.
app = []
dev = [
    "beautifulsoup4>=4.13,<5",
    "pytest>=8.0,<10",
    "pytest-timeout>=2.4,<3",
    "httpx>=0.28,<1",
    "rapidfuzz>=3.6,<4",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "pip-audit==2.10.1",
]

[project.scripts]
unrender-serve = "unrender.product.cli:main"
unrender-admin = "unrender.product.admin:main"
unrender-healthcheck = "unrender.product.healthcheck:main"
unrender-operations-check = "unrender.product.operations_check:main"

[tool.setuptools.packages.find]
include = ["unrender*"]

# Include frozen subsets so scoring also works from an installed wheel.
[tool.setuptools.package-data]
"unrender.eval" = ["subsets/*.json"]
"unrender.product" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.webmanifest",
    "static/icons/*",
    "static/artwork/*",
    "static/demo/*",
    "static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Include top-level Modal and analysis modules during test collection.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "openpyxl", "google.auth.*", "google.oauth2.*", "requests"]
ignore_missing_imports = true
