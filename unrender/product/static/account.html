<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Account help — Unrender</title><link rel="stylesheet" href="/static/app.css">
<script src="/static/account.js" defer></script></head>
<body class="product-shell"><header class="site-header"><a class="wordmark" href="/"><img src="/static/icons/icon-192.png" width="30" height="30" alt=""><span>Unrender</span></a><label class="theme-control"><span class="visually-hidden">Appearance</span><select data-theme-picker aria-label="Appearance"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label></header>
<main class="account-screen"><section class="auth-panel"><h1 id="account-title">Recover your workspace</h1>
<p id="account-description">Checking account recovery options…</p>
<form id="account-form" hidden>
<label id="email-field">Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
<label id="password-field" hidden>Password<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="256" disabled></label>
<button class="button button-primary" type="submit" id="account-submit">Send reset link</button>
</form><p id="account-status" role="status" hidden></p><p id="account-error" role="alert" hidden></p>
<p><a href="/login">Return to sign in</a><span id="email-help-links" hidden> · <a href="/account">Request a password reset</a> · <a href="/account?mode=verify">Resend verification</a></span></p>
<p><a href="/contact">Contact Unrender support</a></p>
</section></main></body></html>
